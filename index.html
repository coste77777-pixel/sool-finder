<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>전통주 발견 — 몰랐던 양조장과 우리술 찾기</title>
  <meta name="description" content="전국 양조장과 우리술을 분야별·지역별로 찾아보는 대시보드">
  <script>
    (function () {
      var theme = null;
      try { theme = localStorage.getItem('sool-theme'); } catch (e) { theme = null; }
      if (theme !== 'dark' && theme !== 'light') {
        theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="site-name" href="index.html">전통주 <span>발견</span></a>
      <nav class="site-nav" aria-label="바로가기">
        <a href="#h-rank">분야별 순위</a>
        <a href="#h-hidden">숨은 양조장</a>
        <a href="#h-news">소식</a>
        <a href="#h-region">지역</a>
        <a href="about.html">순위 기준</a>
      </nav>
      <button id="theme-toggle" class="icon-btn" type="button" aria-label="어두운 화면으로 바꾸기">어둡게</button>
    </div>
  </header>

  <main id="main">
    <div class="wrap">
      <div class="hero">
        <div>
          <p class="kicker" id="kicker">&nbsp;</p>
          <h1>아직 이름을 모르는<br>양조장의 좋은 술.</h1>
        </div>
        <div>
          <p class="lead" id="lead">자료를 불러오는 중입니다…</p>
          <label class="search-box">
            <input id="search" type="search" placeholder="양조장이나 술 이름으로 찾기" aria-label="양조장 또는 술 이름 검색" autocomplete="off">
          </label>
        </div>
        <section class="summary" id="summary" aria-label="요약"></section>
      </div>

      <section id="search-results" class="card" hidden aria-live="polite"></section>

      <div class="cols cols-wrap">
        <section class="card" aria-labelledby="h-rank">
          <div class="section-head">
            <h2 id="h-rank">분야별 순위</h2>
          </div>
          <div class="tabs" id="cat-tabs" role="tablist" aria-label="분야"></div>
          <div class="tabs sub" id="mode-tabs" role="tablist" aria-label="순위 종류"></div>
          <div id="rank-panel" role="tabpanel" tabindex="0"></div>
        </section>
        <section class="card" aria-labelledby="h-hidden">
          <div class="section-head">
            <h2 id="h-hidden">숨은 양조장</h2>
          </div>
          <p class="section-note">수상 실력에 비해 검색에 잘 나오지 않는 곳입니다.</p>
          <div id="hidden-breweries"></div>
        </section>
      </div>

      <div class="grid-2 grid-wrap">
        <section class="card" aria-labelledby="h-news">
          <h2 id="h-news">소식</h2>
          <div id="news"></div>
        </section>
        <section class="card" aria-labelledby="h-new">
          <h2 id="h-new">이번 주 새로 발견</h2>
          <div id="new-found"></div>
        </section>
      </div>

      <section class="card" aria-labelledby="h-region">
        <h2 id="h-region">지역으로 찾기</h2>
        <div class="region-grid" id="region-grid"></div>
        <div id="region-result" aria-live="polite"></div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>19세 미만은 주류를 구매할 수 없습니다.</p>
      <p>구매처 링크는 다른 사이트로 이동하며, 가격과 판매 여부는 그곳에서 확인해 주세요.</p>
      <a href="about.html">순위 기준과 자료 출처</a>
    </div>
  </footer>

  <script type="module" src="js/main-index.js"></script>
</body>
</html>
